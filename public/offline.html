<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f6f4ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e121a" media="(prefers-color-scheme: dark)" />
    <title>Offline · PersonBrief</title>
    <style>
      :root { color-scheme: light dark; --bg: #f6f4ee; --surface: #ffffff; --ink: #141b2b; --muted: #5d6676; --line: #e4dfd3; --accent: #2c56c9; --on-accent: #ffffff; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0e121a; --surface: #151b26; --ink: #e8ebf1; --muted: #9aa3b2; --line: #262f3e; --accent: #7c9dff; --on-accent: #0b1226; } }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); }
      body { display: flex; min-height: 100dvh; align-items: center; justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
      main { width: 100%; max-width: 380px; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 17px; box-shadow: 0 12px 30px rgb(20 27 43 / 0.18); }
      h1 { margin: 22px 0 8px; font-family: "Iowan Old Style", Georgia, serif; font-size: 24px; font-weight: 600; letter-spacing: -0.01em; }
      p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.55; }
      button { margin-top: 26px; height: 48px; padding: 0 28px; border: 0; border-radius: 12px; background: var(--accent); color: var(--on-accent);
        font-size: 16px; font-weight: 600; font-family: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
      button:active { transform: scale(0.98); }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" width="72" height="72" />
      <h1 id="title">You’re offline</h1>
      <p id="body">PersonBrief needs an internet connection to open your research. Nothing is lost — your briefs are stored safely on your server.</p>
      <button id="retry" type="button">Try again</button>
    </main>
    <script>
      (function () {
        var text = {
          az: ["İnternet bağlantısı yoxdur", "PersonBrief araşdırmanızı açmaq üçün internet bağlantısı tələb edir. Heç nə itməyib — arayışlarınız serverinizdə təhlükəsiz saxlanılır.", "Yenidən cəhd edin"],
          ru: ["Нет подключения к интернету", "PersonBrief нужен интернет, чтобы открыть ваши материалы. Ничего не потеряно — справки надёжно хранятся на вашем сервере.", "Повторить"],
        };
        var lang = (document.cookie.match(/(?:^|; )pb_locale=(az|ru|en)/) || [])[1] || (navigator.language || "en").slice(0, 2);
        var t = text[lang];
        if (t) {
          document.documentElement.lang = lang;
          document.getElementById("title").textContent = t[0];
          document.getElementById("body").textContent = t[1];
          document.getElementById("retry").textContent = t[2];
        }
        document.getElementById("retry").addEventListener("click", function () { location.reload(); });
        window.addEventListener("online", function () { location.reload(); });
      })();
    </script>
  </body>
</html>
