# Two fictional people share a name: the app asks which one is meant and the
# research continues only after the choice.
appId: ${APP_ID}
env:
  APP_ID: com.tnhasanov.personbrief.preview
---
- runFlow: subflows/ensure-signed-in.yaml
- runFlow: subflows/demo-workspace.yaml
- scrollUntilVisible:
    element: "Ambiguous name · .*"
- tapOn: "Ambiguous name · .*"
- scrollUntilVisible:
    element:
      id: "start-research"
    direction: UP
- tapOn:
    id: "start-research"
- extendedWaitUntil:
    visible: "Which Tural Mammadov do you mean\\?"
    timeout: 120000
- assertVisible: "None of these — refine search"
- tapOn:
    text: "This is the person"
    index: 0
- extendedWaitUntil:
    visible: "Research complete"
    timeout: 120000
